image:
  repository: ghcr.io/efidvir/transport-twin
  tag: ""                        # default: the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

teraflow:
  # TeraFlowSDN NBI inside the cluster; check the service name and port of your TFS deployment
  url: http://nbiservice.tfs.svc.cluster.local:8080
  credentialsSecret: ""          # optional Secret with TFS_USERNAME / TFS_PASSWORD keys

twin:
  topologySource: rfc8345        # rfc8345 | tfs-api
  port: 9100
  ns3Mode: local                 # local: NS-3 in the image runs every pre-flight | replay: recorded runs
  sitePlan: {}                   # site_plan.json: {design_rain_mmh, hop_distance_m, links: {"a|b": {distance_m}}}

mcp:
  enabled: true
  port: 8766

resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "2", memory: 1Gi}  # each pre-flight is an NS-3 run
