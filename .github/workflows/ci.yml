name: ci

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to ghcr.io (otherwise build and test only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "mcp>=1.2" pytest
      - run: python -m pytest tests -q

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/transport-twin
      - run: helm template twin deploy/helm/transport-twin > /dev/null
      - run: >
          helm template twin deploy/helm/transport-twin --set twin.ns3Mode=replay,teraflow.credentialsSecret=tfs
          --set-json 'twin.sitePlan={"design_rain_mmh":60,"links":{"radio-1|radio-2":{"distance_m":250}}}' > /dev/null

  # The image with NS-3.45 built in, started and asked which engine it runs
  image:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: transport-twin:ci
          cache-from: type=gha,scope=twin
          cache-to: type=gha,mode=max,scope=twin
      - name: Smoke test (NS-3 runs inside the image)
        run: |
          docker run -d --name twin -p 9100:9100 transport-twin:ci
          for i in $(seq 1 30); do curl -fs localhost:9100/healthz >/dev/null && break; sleep 2; done
          curl -fs localhost:9100/api/v1/dti/ceragon/engine | tee engine.json
          python3 -c "import json; e = json.load(open('engine.json')); assert e['mode'] == 'local', e"
          docker exec twin /opt/ns3/build/scratch/ns3.45-ceragon-twin --PrintHelp > /dev/null
      - if: failure()
        run: docker logs twin || true

  # Published only from a version tag (v*) or a manual run with "publish" ticked
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    needs: [image, chart]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/transport-twin
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=twin
